name: Daglig link-tjek

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gendan fejl fra forrige koersel
        uses: actions/cache@v4
        with:
          path: link-check-prev-failures.json
          key: link-check-failures-${{ github.run_id }}
          restore-keys: |
            link-check-failures-

      - name: Koer link-tjekker
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check-links.py

      - name: Gem fejl til naeste koersel
        if: always()
        uses: actions/cache/save@v4
        with:
          path: link-check-prev-failures.json
          key: link-check-failures-${{ github.run_id }}
